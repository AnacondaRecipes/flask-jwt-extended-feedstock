{% set name = "Flask-JWT-Extended" %}
{% set version = "4.7.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 78fd0f460317facf3a0084a6457ffaf2f1dda9eefbd576f94cea35b0eadd5531

build:
  skip: true  # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
  run:
    - python
    - werkzeug >=0.14  # [py<314]
    - flask >=2.0,<4.0  # [py<314]
    # An error occurs when using werkzeug <3.0.0 for python 3.14:
    # ImportError: cannot import name 'url_quote' from 'werkzeug.urls'.
    # This is fixed in werkzeug 3.0.0+ and flask 3.0.0+.
    - werkzeug >=3.0.0,<4.0.0  # [py>=314]
    - flask >=3.0,<4.0  # [py>=314]
    - pyjwt >=2.11.0,<3.0
    - cryptography >=3.3.1

test:
  source_files:
    - tests
  imports:
    - flask_jwt_extended
    - flask_jwt_extended.config
    - flask_jwt_extended.default_callbacks
    - flask_jwt_extended.exceptions
    - flask_jwt_extended.internal_utils
    - flask_jwt_extended.tokens
    - flask_jwt_extended.typing
    - flask_jwt_extended.utils
  requires:
    - pip
    - pytest
    - python-dateutil
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests

about:
  home: https://github.com/vimalloc/flask-jwt-extended
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A Flask JWT extension
  description: |
    Flask-JWT-Extended not only adds support for using JSON Web Tokens (JWT) to Flask for protecting routes,
    but also many helpful (and optional) features built in to make working with JSON Web Tokens easier.
  dev_url: https://github.com/vimalloc/flask-jwt-extended
  doc_url: https://flask-jwt-extended.readthedocs.io

extra:
  recipe-maintainers:
    - lvoliveira
    - nicoddemus
    - igortg
    - synapticarbors
